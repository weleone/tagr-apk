apply plugin: 'com.android.application'

android {
    namespace 'com.weleone.tagr'
    compileSdk 34

    defaultConfig {
        applicationId "com.weleone.tagr"
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName "1.0.19"
    }

    signingConfigs {
        release {
            // 正式签名: keystore 与密码来自 GitHub Secrets (TAGR_KEYSTORE_*),
            // 本地构建时把 tagr-release.jks 放 app 目录并用环境变量传密码
            storeFile file(System.getenv("TAGR_KEYSTORE_PATH") ?: "tagr-release.jks")
            storePassword System.getenv("TAGR_KEYSTORE_PASSWORD")
            keyAlias System.getenv("TAGR_KEY_ALIAS")
            keyPassword System.getenv("TAGR_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
