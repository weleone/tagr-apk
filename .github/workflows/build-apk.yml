name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore
        run: echo "${{ secrets.TAGR_KEYSTORE_BASE64 }}" | base64 -d > app/tagr-release.jks

      - name: Build release APK
        env:
          TAGR_KEYSTORE_PATH: tagr-release.jks
          TAGR_KEYSTORE_PASSWORD: ${{ secrets.TAGR_KEYSTORE_PASSWORD }}
          TAGR_KEY_ALIAS: ${{ secrets.TAGR_KEY_ALIAS }}
          TAGR_KEY_PASSWORD: ${{ secrets.TAGR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          ./gradlew :app:assembleRelease --no-daemon || gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tagr-apk
          path: app/build/outputs/apk/release/app-release.apk
